{% extends 'base.html' %}

{% block title %}
    Delete - {{ post.title }}
{% endblock %}

{% block content %}
<div style="max-width: 500px; margin: 40px auto; font-family: sans-serif; padding: 20px; border: 1px solid #ddd; border-radius: 8px;">
    <h2 style="color: #dc3545; margin-top: 0;">Delete Post</h2>
    <p>Are you sure you want to delete <strong>"{{ post.title }}"</strong>?</p>
    <p style="color: #666; font-size: 14px;">This action cannot be undone.</p>

    <form action="{% url 'blog_delete' post.id %}" method="POST" style="margin-top: 20px;">
        {% csrf_token %}
        <button type="submit" style="padding: 8px 16px; background-color: #dc3545; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">
            Yes, Delete
        </button>
        <a href="{% url 'blog_details' post.id %}" style="margin-left: 15px; color: #666; text-decoration: none;">Cancel</a>
    </form>
</div>
{% endblock %}
