{% extends 'base.html' %}

{% block title %}
    {{ title }}
{% endblock %}

{% block content %}
<div style="max-width: 500px; margin: 30px auto; font-family: sans-serif; background: #fff; padding: 25px; border: 1px solid #ddd; border-radius: 8px;">
    <h2 style="margin-top: 0;">{{ title }}</h2>

    <form method="POST" novalidate>
        {% csrf_token %}

        <div style="margin-bottom: 20px;">
            <label for="name" style="display: block; font-weight: bold; margin-bottom: 6px;">Category Name:</label>
            <input 
                type="text" 
                id="name" 
                name="name" 
                value="{{ form.name.value|default:'' }}" 
                placeholder="Enter category name" 
                style="width: 100%; padding: 8px; box-sizing: border-box; {% if form.name.errors %}border: 1px solid #dc3545;{% endif %}"
            >
            {% if form.name.errors %}
                <div style="color: #dc3545; font-size: 13px; margin-top: 5px;">
                    {{ form.name.errors.0 }}
                </div>
            {% endif %}
        </div>

        <button type="submit" style="padding: 10px 20px; background-color: #007bff; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer;">
            {{ button_text }}
        </button>

        <a href="{% url 'category_list' %}" style="margin-left: 15px; color: #666; text-decoration: none;">Cancel</a>
    </form>
</div>
{% endblock %}
