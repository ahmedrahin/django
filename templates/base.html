<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %} {% endblock %} || Django </title>
  {% load static %}
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f8f9fa;
      color: #333;
    }
    .navbar {
      background-color: #343a40;
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: white;
    }
    .navbar a {
      color: #f8f9fa;
      text-decoration: none;
      margin-left: 15px;
      font-size: 14px;
    }
    .navbar a:hover {
      text-decoration: underline;
    }
    .navbar .brand {
      font-weight: bold;
      font-size: 18px;
      margin-left: 0;
    }
    .container {
      max-width: 900px;
      margin: 20px auto;
      padding: 0 15px;
    }
    .alert {
      padding: 12px 16px;
      border-radius: 4px;
      margin-bottom: 20px;
      font-size: 14px;
    }
    .alert-success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    .alert-info { background-color: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }
    .alert-error, .alert-danger { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    .errorlist { color: #dc3545; font-size: 13px; margin: 5px 0; padding-left: 20px; }
  </style>
</head>
<body>

  <nav class="navbar">
    <div style="display: flex; align-items: center; gap: 20px;">
      <a href="{% url 'home' %}" class="brand">Django Blog</a>
      <a href="{% url 'home' %}">Home</a>
      <a href="{% url 'list' %}">Posts</a>
      <a href="{% url 'category_list' %}">Categories</a>
    </div>
    <div>
      {% if user.is_authenticated %}
        <span style="font-size: 14px; color: #adb5bd;">Hello, <strong>{{ user.username }}</strong></span>
        <a href="{% url 'logout' %}" style="color: #ff6b6b; font-weight: bold;">Logout</a>
      {% else %}
        <a href="{% url 'login' %}">Login</a>
        <a href="{% url 'register' %}" style="background-color: #007bff; padding: 6px 12px; border-radius: 4px;">Register</a>
      {% endif %}
    </div>
  </nav>

  <div class="container">
    {% if messages %}
      {% for message in messages %}
        <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %}">
          {{ message }}
        </div>
      {% endfor %}
    {% endif %}

    {% block content %}{% endblock %}
  </div>

</body>
</html>
